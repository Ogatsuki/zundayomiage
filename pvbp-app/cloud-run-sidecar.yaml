# Cloud Run マルチコンテナ（サイドカー）構成例
# このファイルは参考用です。実際のデプロイはgcloud CLIまたはConsoleから行います

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pvbp-zundayomiage
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      containers:
        # メインコンテナ: PVBP準拠Next.jsアプリ
        - name: app
          image: gcr.io/PROJECT_ID/pvbp-app:latest
          ports:
            - containerPort: 3000
              name: http1
          env:
            - name: NODE_ENV
              value: "production"
            - name: VOICEVOX_API_URL
              value: "http://localhost:50021"  # サイドカーと同一Pod内通信
            - name: NEXT_PUBLIC_VOICEVOX_API_URL
              value: "https://YOUR_DOMAIN.run.app"  # クライアントからのアクセス用
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"

        # サイドカーコンテナ: VOICEVOX Engine
        - name: voicevox
          image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          ports:
            - containerPort: 50021
          env:
            - name: TZ
              value: "Asia/Tokyo"
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"  # VOICEVOXは多めのメモリが必要
          startupProbe:
            httpGet:
              path: /version
              port: 50021
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10