services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    ports:
      - "50021:50021"
    environment:
      - TZ=Asia/Tokyo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:50021/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - pvbp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VOICEVOX_API_URL=http://voicevox:50021
      - NEXT_PUBLIC_VOICEVOX_API_URL=http://localhost:50021
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      voicevox:
        condition: service_healthy
    networks:
      - pvbp-network
    restart: unless-stopped

networks:
  pvbp-network:
    driver: bridge