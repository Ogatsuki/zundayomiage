services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    container_name: tsd107_voicevox
    ports:
      - "127.0.0.1:50021:50021"
    networks:
      - tsd107_network
    restart: unless-stopped
    environment:
      - PORT=50021
      - VOICEVOX_CPU_NUM_THREADS=4
      - VOICEVOX_ENGINE_HOST=0.0.0.0
      - VOICEVOX_ENGINE_PORT=50021
      - VOICEVOX_CORS_POLICY_MODE=all
      - VOICEVOX_ALLOW_ORIGIN=*
  nextjs:
    container_name: tsd107_nextjs
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # ソースコードディレクトリを個別にマウント（.envファイル除外）
      - ./app:/app/app
      - ./components:/app/components
      - ./lib:/app/lib
      - ./types:/app/types
      - ./tasks:/app/tasks
      # 設定ファイルを個別にマウント
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./next.config.js:/app/next.config.js:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tailwind.config.js:/app/tailwind.config.js:ro
      - ./postcss.config.js:/app/postcss.config.js:ro
      # ビルド生成物はコンテナ内で保持
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - VOICEVOX_URL=http://voicevox:50021  # Dockerネットワーク内通信用に上書き
    networks:
      - tsd107_network
    depends_on:
      - voicevox
    restart: unless-stopped

networks:
  tsd107_network:
    driver: bridge
